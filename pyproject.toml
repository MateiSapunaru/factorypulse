[tool.poetry]
name = "factorypulse"
version = "0.1.0"
description = "End-to-end time-series anomaly detection on synthetic industrial data"
authors = ["Matei Săpunaru <your_email@example.com>"]
readme = "README.md"
packages = [{ include = "factorypulse", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2.3"
numpy = "^2.1.2"
scikit-learn = "^1.5.2"
scipy = "^1.14.1"
torch = "^2.5.1"
mlflow = "^2.17.2"
streamlit = "^1.39.0"
plotly = "^5.24.1"
sqlalchemy = "^2.0.36"
psycopg2-binary = "^2.9.9"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.0"
pyyaml = "^6.0.2"
python-dotenv = "^1.0.1"
typer = "^0.12.5"
rich = "^13.9.2"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
azure-ai-ml = "^1.19.0"
azure-identity = "^1.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
black = "^24.10.0"
mypy = "^1.11.2"
pre-commit = "^4.0.1"
ipykernel = "^6.29.5"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.39"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"